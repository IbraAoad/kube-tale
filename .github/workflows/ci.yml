name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: latest
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -cover -coverprofile=coverage.out ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"
      - name: build
        run: go build -o /dev/null ./cmd/kube-tale

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"

      - name: Create k8s cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kube-tale-test

      - name: Wait for cluster
        run: kubectl wait --for=condition=Ready node --all --timeout=60s

      - name: Integration tests
        run: go test -race -v -tags=integration ./internal/client/ ./cmd/kube-tale/
